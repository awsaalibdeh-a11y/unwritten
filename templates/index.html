<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Unwritten — every life, written as you live it</title>
  <meta name="description" content="A life simulator where every year of your life is written live by an AI. Make choices, chase dreams, live again." />
  <meta name="theme-color" content="#0e0c16" />
  <meta property="og:title" content="Unwritten" />
  <meta property="og:description" content="Every life, written as you live it." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Chivo+Mono:wght@500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_v }}" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="i-career"><rect x="3" y="7" width="18" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 12.5h18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></g>
      <g id="i-people"><circle cx="9" cy="8.5" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5M16 5.8a3 3 0 0 1 0 5.6M17.5 14.3c1.7.6 2.8 2.2 3.1 4.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></g>
      <g id="i-assets"><path d="M3.5 11 12 4l8.5 7M5.5 9.5V20h13V9.5M10 20v-5h4v5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g id="i-activities"><path d="M13 3 5 13.5h6L10 21l8-10.5h-6L13 3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></g>
      <g id="i-close"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g>
      <g id="i-dice"><rect x="4" y="4" width="16" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="9" r="1.3" fill="currentColor"/><circle cx="15" cy="15" r="1.3" fill="currentColor"/><circle cx="15" cy="9" r="1.3" fill="currentColor"/><circle cx="9" cy="15" r="1.3" fill="currentColor"/></g>
      <g id="i-chevron"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    </defs>
  </svg>

  <div class="app" id="app">

    <!-- start -->
    <section class="screen start" id="start-screen">
      <div class="start-inner">
        <p class="kicker">A life simulator</p>
        <h1 class="wordmark">Unwritten</h1>
        <p class="tagline">Every life, written as you live it.</p>

        <div class="setup">
          <label class="field">
            <span class="field-label">Name</span>
            <span class="name-row">
              <input id="setup-name" type="text" maxlength="24" autocomplete="off" spellcheck="false" />
              <button class="icon-btn" id="reroll-name" type="button" title="Random name" aria-label="Random name"><svg width="20" height="20" viewBox="0 0 24 24"><use href="#i-dice"/></svg></button>
            </span>
          </label>
          <div class="field">
            <span class="field-label">Gender</span>
            <div class="segmented" id="setup-gender" role="radiogroup">
              <button type="button" role="radio" data-value="female">Female</button>
              <button type="button" role="radio" data-value="male">Male</button>
            </div>
          </div>
          <label class="field">
            <span class="field-label">Born in</span>
            <select id="setup-country"></select>
          </label>
          <div class="field">
            <span class="field-label">You'll be born with</span>
            <div class="roll" id="setup-roll"></div>
          </div>
          <button class="ghost-btn" id="continue-btn" type="button" hidden>Continue your life</button>
          <button class="primary-btn" id="begin-btn" type="button">Begin a new life</button>
        </div>
        <section class="past-lives" id="past-lives" hidden></section>
        <p class="rating">Rated 13+ · stories written by AI</p>
      </div>
    </section>

    <!-- game -->
    <section class="screen game" id="game-screen" hidden>
      <header class="hero" id="hero" role="button" tabindex="0" aria-label="Your goals and stats">
        <div class="avatar" id="avatar"></div>
        <div class="hero-text">
          <div class="hero-name" id="hero-name"></div>
          <div class="hero-sub"><span class="flap" id="age-flap">0</span><span class="hero-role" id="hero-role"></span></div>
        </div>
        <div class="money" id="money"></div>
      </header>

      <main class="log" id="log" aria-live="polite"></main>

      <section class="stats" id="stats" aria-label="Stats"></section>

      <div class="danger-banner" id="danger-banner" hidden></div>

      <nav class="dock">
        <button class="dock-btn" data-sheet="career" type="button"><svg width="22" height="22" viewBox="0 0 24 24"><use href="#i-career"/></svg><span id="dock-career-label">School</span></button>
        <button class="dock-btn" data-sheet="people" type="button"><svg width="22" height="22" viewBox="0 0 24 24"><use href="#i-people"/></svg><span>People</span></button>
        <button class="age-btn" id="age-btn" type="button" aria-label="Age up one year"><span class="age-plus">+1</span><span class="age-word">Age</span></button>
        <button class="dock-btn" data-sheet="assets" type="button"><svg width="22" height="22" viewBox="0 0 24 24"><use href="#i-assets"/></svg><span>Assets</span></button>
        <button class="dock-btn" data-sheet="activities" type="button"><svg width="22" height="22" viewBox="0 0 24 24"><use href="#i-activities"/></svg><span>Activities</span></button>
      </nav>
    </section>

    <!-- death -->
    <section class="screen death" id="death-screen" hidden>
      <div class="death-inner">
        <p class="kicker">Rest in peace</p>
        <h1 class="death-name" id="death-name"></h1>
        <p class="death-sub" id="death-sub"></p>
        <p class="ribbon" id="ribbon" hidden></p>
        <div class="death-stats" id="death-stats"></div>
        <div id="wrapped"></div>
        <article class="obituary"><p id="obituary-text"></p></article>
        <p class="epitaph" id="epitaph" hidden></p>
        <button class="primary-btn" id="new-life-btn" type="button">Live another life</button>
      </div>
    </section>
  </div>

  <!-- the year's event, typed out live -->
  <div class="modal" id="event-modal" hidden>
    <div class="event-card" role="dialog" aria-modal="true" aria-labelledby="event-title">
      <p class="event-kicker" id="event-kicker"></p>
      <h2 class="event-title" id="event-title"></h2>
      <p class="event-text" id="event-text"></p>
      <div class="choices" id="choices"></div>
      <div class="outcome" id="outcome" hidden>
        <p class="outcome-text" id="outcome-text"></p>
        <div class="chips" id="chips"></div>
      </div>
      <div class="event-actions" id="event-actions" hidden></div>
    </div>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="sheet-title">
    <header class="sheet-head">
      <button class="icon-btn" id="sheet-back" type="button" aria-label="Back" hidden><svg width="18" height="18" viewBox="0 0 24 24" style="transform:rotate(180deg)"><use href="#i-chevron"/></svg></button>
      <h2 id="sheet-title"></h2>
      <button class="icon-btn" id="sheet-close" type="button" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
    </header>
    <p class="ledger" id="sheet-ledger"></p>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="{{ url_for('static', filename='game.js') }}?v={{ asset_v }}"></script>
</body>
</html>
